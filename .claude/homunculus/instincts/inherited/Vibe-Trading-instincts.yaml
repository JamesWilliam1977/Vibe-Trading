# Vibe Trading Workflow Add New Backtest Engine

## Action

Follow the add-new-backtest-engine workflow:
1. Create or update engine file in agent/backtest/engines/ (e.g., china_a.py, crypto.py, forex.py, composite.py)
2. Update agent/backtest/engines/__init__.py to register the new engine
3. Update agent/backtest/runner.py to route to the correct engine based on market detection
4. Update or create models and metrics if new data structures or calculations are needed (agent/backtest/models.py, agent/backtest/metrics.py)
5. Add or update tests for the new engine in agent/tests/
6. Update README.md and relevant SKILL.md files to document the new engine

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: agent/backtest/engines/*.py, agent/backtest/engines/__init__.py, agent/backtest/runner.py

